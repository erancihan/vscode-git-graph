name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npm test
      - run: npx vsce package --out vscode-git-graph.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: git-graph-vsix
          path: vscode-git-graph.vsix
          retention-days: 14
