name: Release

# Publishes the extension when a version tag (for example v2.0.0) is pushed.
# Required repository secrets:
#   VSCE_PAT  - Azure DevOps personal access token with the "Marketplace (Manage)" scope.
#   OVSX_PAT  - Open VSX access token for the publisher namespace.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - name: Check that the tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
      - name: Package
        run: npx vsce package --out "git-graph-${GITHUB_REF_NAME}.vsix"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: git-graph-*.vsix
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Publish to Visual Studio Marketplace
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath git-graph-*.vsix
      - name: Publish to Open VSX
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish git-graph-*.vsix
