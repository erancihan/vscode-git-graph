name: Release

# Publishes the extension when a version tag (for example v2.0.0) is pushed.
# Required repository secrets:
#   VSCE_PAT  - Azure DevOps personal access token with the "Marketplace (Manage)" scope.
#   OVSX_PAT  - Open VSX access token for the publisher namespace.
#
# Job layout: the build job produces the .vsix. The GitHub release job is the
# only one that uses a third-party action, and it has no access to the
# publishing tokens. The publish job uses the tokens and runs no third-party
# actions.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - name: Check that the tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
      - name: Package
        run: npx vsce package --out "vscode-git-graph-${GITHUB_REF_NAME}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-git-graph-*.vsix
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: vscode-git-graph-*.vsix
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish:
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Installs vsce and ovsx from the committed lockfile, so versions and
      # integrity hashes are fixed. Scripts are skipped; nothing is built here.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --packagePath vscode-git-graph-*.vsix
      # Open VSX publishing is skipped until the OVSX_PAT secret exists.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --no-install ovsx publish vscode-git-graph-*.vsix
